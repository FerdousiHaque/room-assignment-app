name: Tests

# Runs the unit tests (vitest) on every push to main and every pull request.
# Kept separate from the deploy workflow, so a failing test shows a red X in
# the Actions tab without blocking a deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
